apiVersion: apps/v1
kind: Deployment

metadata:
  name: seclock-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: seclock

  template:
    metadata:
      labels:
        app: seclock

    spec:
      containers:
        - name: seclock

          image: YOUR_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/seclock:latest

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
